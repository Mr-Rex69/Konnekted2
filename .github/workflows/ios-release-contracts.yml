name: iOS release workflow contracts
'on':
  pull_request:
    paths:
      - '.github/workflows/ios-ci.yml'
      - '.github/workflows/ios-release-contracts.yml'
      - 'tool/platform_releases.py'
      - 'tool/ios_sideload_release.py'
      - 'tool/test_ios_workflow.py'
      - 'tool/test_ios_sideload_release.py'
      - 'tool/ci_platform_releases_test.py'
      - 'tool/ci_ios_store_distribution_test.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios-ci.yml'
      - '.github/workflows/ios-release-contracts.yml'
      - 'tool/platform_releases.py'
      - 'tool/ios_sideload_release.py'
      - 'tool/test_ios_workflow.py'
      - 'tool/test_ios_sideload_release.py'
      - 'tool/ci_platform_releases_test.py'
      - 'tool/ci_ios_store_distribution_test.py'
permissions:
  contents: read
jobs:
  release-contracts:
    name: Audit iOS publication gates and release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install YAML parser for workflow contracts
        run: python3 -m pip install PyYAML==6.0.2
      - name: Check release dependency graph and native acceptance opt-in
        run: python3 -m unittest discover -s tool -p test_ios_workflow.py
      - name: Verify publish context and truthful qualification
        run: python3 -m unittest discover -s tool -p test_ios_sideload_release.py
      - name: Verify standard GitHub release metadata and asset integrity
        run: |
          python3 -m unittest discover -s tool -p ci_platform_releases_test.py
          python3 -m unittest discover -s tool -p ci_ios_store_distribution_test.py
