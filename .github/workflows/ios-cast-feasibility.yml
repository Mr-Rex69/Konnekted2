name: iPhone Cast SDK feasibility

on:
  pull_request:
    paths:
      - 'tool/cast_feasibility.py'
      - '.github/workflows/ios-cast-feasibility.yml'
      - 'ios/Runner/LokalCastController.swift'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-cast-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cast-sdk:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile and link real Google Cast symbols for device and simulator
        run: python3 tool/cast_feasibility.py
      - name: Preserve source, resolved packages and compiler evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: iPhone-Cast-SDK-probe-${{ github.run_number }}-attempt${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/lokal-cast-probe/Package.swift
            ${{ runner.temp }}/lokal-cast-probe/Package.resolved
            ${{ runner.temp }}/lokal-cast-probe/.swiftpm/configuration/Package.resolved
            ${{ runner.temp }}/lokal-cast-probe/Sources/
            ${{ runner.temp }}/lokal-cast-probe/cast-probe-report.json
            ${{ runner.temp }}/lokal-cast-probe/build-*.log
          retention-days: 14
          if-no-files-found: warn
