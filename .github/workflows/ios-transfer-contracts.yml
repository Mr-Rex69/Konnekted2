name: iPhone native transfer contracts

on:
  pull_request:
    paths:
      - 'ios/Transfers/**'
      - 'ios/Runner/LokalTransferBridge.swift'
      - 'ios/Runner/AppDelegate.swift'
      - 'ios/Runner.xcodeproj/project.pbxproj'
      - 'tool/ios_transfer_contracts.py'
      - 'tool/ios_transfer_fixture.py'
      - 'tool/ios_import_store_contracts.*'
      - 'lib/data/entities/**'
      - 'lib/models/ios_transfer_import.dart'
      - 'lib/models/ios_transfer_models.dart'
      - 'lib/services/ios_transfer_import_store.dart'
      - 'lib/models/ios_transfer_recovery.dart'
      - 'lib/models/ios_transfer_cleanup.dart'
      - 'lib/services/ios_transfer_coordinator_port.dart'
      - 'lib/services/ios_transfer_import_coordinator.dart'
      - 'lib/services/ios_transfer_media.dart'
      - 'lib/services/ios_transfer_media_probe.dart'
      - 'tool/ios_import_coordinator_contracts.dart'
      - 'tool/ios_import_legacy_schema.dart'
      - 'test/fixtures/ios_receipt_v1/**'
      - 'pubspec.*'
      - 'test/fixtures/ios_transfer_credentials_v2.json'
      - 'test/fixtures/ios_transfer_cleanup_v1.json'
      - 'test/fixtures/ios_transfer_intents_v1.json'
      - '.github/workflows/ios-transfer-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-transfer-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  journal:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Prepare the real Flutter Apple framework
        run: flutter precache --ios
      - name: Exercise actual files, processes and iOS 16 journal APIs
        run: python3 tool/ios_transfer_contracts.py --check-ios-sdks --check-flutter-bridge --repeat-native 20
      - name: Resolve the locked native database package
        run: flutter pub get --enforce-lockfile
      - name: Exercise actual Isar import transactions and process recovery
        run: python3 tool/ios_import_store_contracts.py
      - name: Exercise the root coordinator with actual Isar recovery
        run: python3 tool/ios_import_store_contracts.py --coordinator
