name: Keep platform releases tidy
on:
  workflow_dispatch:
  release:
    types: [published]
  workflow_run:
    workflows: ['Release Lokal Mobile', 'iPhone build and sideload package']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: lokal-mobile-publication
  cancel-in-progress: false

jobs:
  consolidate:
    # Only default-branch code touches releases. Never execute code or consume
    # build artifacts from the triggering run/PR in this write-token job.
    if: >-
      github.repository == 'lokal-music/Mobile' &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Retain current downloads and remove superseded mobile releases/tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tool/platform_releases.py consolidate --cleanup
