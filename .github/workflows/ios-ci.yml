permissions:
  contents: read

concurrency:
  group: ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  iphone:
    runs-on: macos-15
    timeout-minutes: 90
    outputs:
      integration_artifact: ${{ steps.simulator_bundle.outputs.artifact-id }}
      integration_fixture: ${{ steps.integration_build.outputs.fixture_identity }}
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      IPHONEOS_DEPLOYMENT_TARGET: '16.0'
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
      LOKAL_IOS_VIDEO_PROBE: ${{ inputs.live_video_probe || false }}
      LOKAL_IOS_DISCOVERY_FIXTURE: lokal-ios-fixture-${{ github.run_id }}-${{ github.run_attempt }}
      IOS_SIMULATOR_RUNTIME_VERSION: '18.6'
      IOS_SIMULATOR_DEVICE_TYPE: com.apple.CoreSimulator.SimDeviceType.iPhone-16
      LOKAL_IOS_CARGO_CACHE_ROOT: ${{ github.workspace }}/.dart_tool/lokal-ios-cargo
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Configure the Apple build
        run: |
          xcode-select -p
          sudo xcode-select --switch "$DEVELOPER_DIR"
          xcodebuild -version
          flutter config --no-enable-swift-package-manager
          rustup toolchain install 1.98.0 --profile minimal --no-self-update
          rustup target add --toolchain 1.98.0 aarch64-apple-ios aarch64-apple-ios-sim
          flutter pub get --enforce-lockfile
          python3 tool/ios_readiness.py --require-scaffold --require-localizations
          python3 -m unittest discover -s tool -p test_ios_prepare_ffmpeg.py
          python3 -m unittest discover -s tool -p test_ios_simulator.py
          python3 -m unittest discover -s tool -p test_ios_sideload_release.py
          python3 -m unittest discover -s tool -p test_ios_native_symbols.py
          python3 -m unittest discover -s tool -p test_ios_verify_engineering_release.py
          python3 -m unittest discover -s tool -p test_ios_control_runner.py
      - name: Verify native transfer storage and the real Flutter bridge
        run: |
          flutter precache --ios
          python3 tool/ios_transfer_contracts.py --check-ios-sdks --check-flutter-bridge --repeat-native 5
      - name: Generate native alternate icons
        run: |
          python3 -m venv "$RUNNER_TEMP/lokal-ios-assets"
          "$RUNNER_TEMP/lokal-ios-assets/bin/pip" install -r tool/requirements-release-art.txt
          "$RUNNER_TEMP/lokal-ios-assets/bin/python" tool/gen_ios_icons.py
      - name: Verify the FFmpeg native dependency
        run: python3 tool/ios_prepare_ffmpeg.py
      - name: Verify and stage the native SMB device/simulator framework
        run: |
          python3 -m unittest discover -s tool -p test_ios_prepare_smb.py
          python3 -m unittest discover -s tool -p test_ios_package_smb.py
          python3 tool/ios_prepare_smb.py
          python3 tool/ios_smb_link_probe.py
      - name: Check application and integration-test compilation
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings lib integration_test
      - name: Verify playback ownership and transport contracts
        run: |
          node --version
          flutter test --no-pub test/services/ios_transfer_upload_operations_test.dart test/services/ios_transfer_upload_queue_actions_test.dart test/services/ios_soulseek_lifecycle_test.dart test/features/search/soulseek_search_test.dart test/services/rust_audio_polling_test.dart test/services/last_played_service_test.dart test/features/search/local_lyrics_matcher_test.dart test/features/settings/artwork_repair_screen_test.dart test/services/artwork_pixel_validation_test.dart test/services/artwork_repair_service_test.dart test/services/artwork_repair_execution_test.dart test/services/desktop_copy_favorites_test.dart test/services/online_favorites_test.dart test/providers/favorites_provider_stability_test.dart test/services/link test/services/shared_motion_playback_test.dart test/widgets/motion_art_suppression_test.dart test/discovery/artwork_redirect_transport_test.dart test/discovery/discovery_playback_test.dart test/services/catalogue_quality_test.dart test/core/app_log_persistence_test.dart test/widgets/share_actions_test.dart test/features/search/footer_search_keyboard_test.dart test/widgets/lokal/queue_reordering_test.dart test/widgets/lokal/queue_sheet_test.dart test/widgets/lokal/lokal_queue_reveal_test.dart test/discovery/source_transport_success_abort_test.dart test/discovery/online_source_log_label_test.dart test/discovery/youtube_music_home_categories_test.dart test/konnekted/discovery_shelf_layout_test.dart test/konnekted/konnekted_components_test.dart test/konnekted/konnekted_you_test.dart test/features/settings/spotify_cookie_data_placement_test.dart test/konnekted/home_navigation_localization_test.dart test/widgets/lokal/lokal_cover_flow_test.dart test/discovery/soundcloud_source_test.dart test/services/playback_source_priority_test.dart test/features/folders/folder_artwork_mosaic_test.dart test/features/player/lyrics_subline_timing_test.dart test/features/player/flowing_lyric_subline_test.dart test/features/settings/eco_data_mode_settings_test.dart test/features/settings/ios_source_controls_localization_test.dart test/flow test/services/automix_advanced_report_test.dart test/services/automix_analysis_cache_test.dart test/services/automix_stem_clip_test.dart test/services/replayable_liked_streams_test.dart test/services/queue_pre_resolver_test.dart test/discovery/http_only_playback_test.dart test/discovery/http_addon_atmos_test.dart test/discovery/http_addon_manifest_settings_test.dart test/features/player/lyrics_file_export_test.dart test/discovery/monochrome_source_test.dart test/discovery/online_sources_test.dart test/discovery/discovery_sources_test.dart test/widgets/lokal/http_addons_settings_panel_test.dart test/widgets/lokal/playback_source_priority_panel_test.dart test/spotify/artist_follow_link_test.dart test/spotify/spotify_web_api_test.dart test/providers/optional_source_preferences_test.dart test/konnekted/artist_favorites_localization_test.dart test/widgets/audio_recovery_notice_test.dart test/services/audio_session_manager_fallback_test.dart test/services/local_audio_lifecycle_test.dart test/services/local_audio_output_registry_test.dart test/services/audio_engine_manager_retirement_test.dart test/services/audio_engine_manager_failure_test.dart test/services/android_audio_failed_source_test.dart test/services/android_audio_engine_crossfade_test.dart test/features/internet_radio/radio_timeout_test.dart test/services/casting/cast_handoff_test.dart test/services/casting/chromecast_backend_test.dart test/services/casting/cast_source_test.dart test/services/external_playback_owner_test.dart test/services/rust_audio_engine_pause_test.dart test/features/music_videos test/features/player/space_video_overlay_test.dart test/features/player/video_space_layout_test.dart test/features/player/immersive_lyrics_stage_test.dart test/services/casting/cast_content_server_test.dart test/services/lyricsplus_normalizer_test.dart test/services/lyrics_source_hits_test.dart test/discovery/library_download_test.dart test/features/player/lyrics_source_localization_test.dart test/features/player/artist_credit_links_test.dart test/services/lyrics_word_timing_test.dart test/services/moving_cover_availability_test.dart test/konnekted/konnekted_discovery_test.dart test/konnekted/library_localization_test.dart test/konnekted/dock_localization_test.dart test/morneye/morneye_test.dart test/morneye/morneye_addons_panel_test.dart test/features/player/lyrics_save_button_test.dart test/features/player/lyrics_save_button_localization_test.dart test/konnekted/library_add_sheet_test.dart test/konnekted/library_occurrence_selection_test.dart test/widgets/motion_art_warm_preview_test.dart test/services/http_addon_short_stream_guard_test.dart test/discovery/http_addon_manifest_settings_test.dart test/services/player_service_format_test.dart test/services/player_service_shuffle_test.dart test/features/konnekted test/features/link/lokal_ghost_availability_test.dart test/discovery/discovery_source_resolution_quality_test.dart test/discovery/source_resolution_localization_test.dart test/morneye/morneye_signing_test.dart test/services/lyrics_translation_test.dart test/services/lyrics_mobile_parity_test.dart test/features/player/player_transport_motion_test.dart test/services/android_auto_catalog_test.dart test/classipod/classipod_controller_test.dart test/widgets/lokal/online_search_section_test.dart test/konnekted/list_filter_persistence_test.dart test/konnekted/liked_sort_persistence_test.dart test/features/search/search_filters_test.dart test/features/player/full_player_action_chip_row_test.dart test/features/player/full_player_overflow_actions_test.dart test/widgets/lokal/lokal_settings_groups_test.dart test/widgets/lokal/lokal_settings_kit_test.dart test/services/lokal_remote_credentials_store_test.dart test/services/ios_transfer_transport_test.dart test/services/ios_transfer_publication_transport_test.dart test/services/ios_transfer_recovery_transport_test.dart test/services/ios_transfer_upload_recovery_transport_test.dart test/services/ios_transfer_upload_admission_test.dart test/services/ios_transfer_upload_binding_test.dart test/services/ios_transfer_upload_source_transport_test.dart test/services/ios_transfer_upload_session_test.dart test/services/ios_transfer_queue_test.dart test/services/ios_transfer_queue_transport_test.dart test/services/ios_transfer_copy_plan_test.dart test/features/link/ios_transfer_queue_screen_test.dart test/services/ios_transfer_cleanup_transport_test.dart test/services/ios_transfer_orphan_transport_test.dart test/services/ios_transfer_submission_test.dart test/services/ios_transfer_mutation_barrier_test.dart test/services/ios_foreground_transfer_barrier_test.dart test/services/ios_library_scan_epoch_test.dart test/services/ios_pairing_retirement_test.dart test/providers/ios_transfer_provider_test.dart test/morneye/morneye_iphone_stereo_quality_test.dart test/services/online_lyrics_service_test.dart test/features/player/lyrics_search_sheet_test.dart test/services/atmos_ac4_source_test.dart test/services/tidal_atmos_metadata_test.dart test/services/ios_transfer_scan_guard_test.dart test/services/local_network_access_test.dart test/services/smb_service_parse_test.dart test/services/smb_native_transport_test.dart test/services/ios_nas_scan_retirement_test.dart test/services/webdav_service_test.dart test/services/webdav_sync_integration_test.dart test/services/library_scanner*test.dart test/data/repositories/song_repository_test.dart test/data/repositories/link_history_projection_test.dart test/providers/lokal_manual_desktop_sync_test.dart test/services/album_art_service_test.dart test/services/playback_secure_storage_test.dart test/providers/lokal_remote_provider_test.dart test/services/lokal_remote_service_test.dart test/discovery/online_song_save_test.dart test/features/whats_new test/providers/whats_new_provider_test.dart test/widgets/lokal/lokal_player_route_test.dart test/widgets/lokal/lokal_settings_reskin_test.dart test/core/theme/lokal_appearance_test.dart test/konnekted/discovery_snapshot_cache_test.dart test/konnekted/discovery_spotify_cache_ownership_test.dart test/konnekted/discovery_source_test.dart test/widgets/lokal/lokal_quality_test.dart test/features/player/full_bleed_artwork_frame_test.dart test/features/player/player_morph_return_test.dart test/core/utils/responsive_text_test.dart test/player/playback_speed_steps_test.dart test/features/player/song_stage_carousel_dissolve_test.dart test/features/player/cloud_cover_shader_pixels_test.dart test/features/catalogue test/features/search/global_catalogue_category_test.dart test/services/global_catalogue_search_test.dart test/features/search/online_catalogue_search_test.dart test/services/android_widget_contract_test.dart test/konnekted/library_recently_played_shelf_test.dart test/konnekted/lokal_genres_grouping_test.dart test/widgets/lokal/lokal_swipe_to_queue_test.dart test/morneye/morneye_live_playback_test.dart
      - name: Check the native build helper before Xcode
        working-directory: rust_builder/cargokit/build_tool
        run: |
          dart pub get --enforce-lockfile
          dart analyze --no-fatal-warnings lib/src/builder.dart
      - name: Restore the matching native build cache
        id: rust_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .dart_tool/lokal-ios-cargo
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/registry/index
          key: ios-cargo-symbols-v2-${{ runner.os }}-${{ runner.arch }}-xcode26.0.1-rust1.98.0-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml', 'rust/cargokit.yaml', 'rust/**/*.rs', 'rust/vendor/**', 'rust_builder/cargokit/build_tool/lib/**', 'rust_builder/cargokit/*.sh') }}
      - name: Build the release iPhone app without signing credentials
        id: device_build
        run: |
          if ! flutter build ios --release --no-codesign --no-pub --build-number '${{ github.run_number }}' --split-debug-info=build/ios/dart-symbols --verbose > "$RUNNER_TEMP/ios-device-build.log" 2>&1; then
            python3 tool/ios_build_diagnostics.py "$RUNNER_TEMP/ios-device-build.log"
            exit 1
          fi
      - name: Inspect and package the engineering IPA
        id: package
        run: |
          python3 tool/ios_package.py build/ios/iphoneos/Runner.app build/ios/ipa/Lokal-unsigned.ipa --dart-symbols build/ios/dart-symbols
          git archive --format=tar.gz HEAD -o build/ios/ipa/Lokal-source.tar.gz
      - name: Preserve the unsigned engineering build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Lokal-iPhone-engineering-unsigned-${{ github.run_number }}-attempt${{ github.run_attempt }}
          path: |
            build/ios/ipa/*
            build/ios/iphoneos/*.dSYM
          if-no-files-found: error
          retention-days: 30
      - name: Boot an iPhone simulator
        timeout-minutes: 16
        run: python3 tool/ios_simulator.py --recover-preinstall-boot
      - name: Verify the simulator with a minimal Flutter control app
        id: control
        timeout-minutes: 16
        run: |
          flutter create --platforms=ios --org app.lokal --project-name lokal_control "$RUNNER_TEMP/lokal-control"
          (
            cd "$RUNNER_TEMP/lokal-control"
            if ! flutter build ios --simulator --debug --verbose > "$RUNNER_TEMP/ios-control-build.log" 2>&1; then
              python3 "$GITHUB_WORKSPACE/tool/ios_build_diagnostics.py" "$RUNNER_TEMP/ios-control-build.log"
              exit 1
            fi
          )
          python3 tool/ios_control_runner.py "$RUNNER_TEMP/lokal-control/build/ios/iphonesimulator/Runner.app"
      - name: Preserve simulator control evidence
        if: always() && env.IOS_SIMULATOR_UDID != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: iPhone-simulator-control-${{ github.run_number }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-control*
          if-no-files-found: ignore
      - name: Build the complete app for iOS simulator
        id: simulator_build
        run: |
          if ! flutter build ios --simulator --debug --no-pub --verbose > "$RUNNER_TEMP/ios-simulator-build.log" 2>&1; then
            python3 tool/ios_build_diagnostics.py "$RUNNER_TEMP/ios-simulator-build.log"
            exit 1
          fi
      - name: Capture the actual first launch
        id: launch
        run: python3 tool/ios_launch_probe.py
      - name: Preserve the first-launch evidence before testing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: iPhone-first-launch-${{ github.run_number }}-attempt${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/lokal-iphone.log
            ${{ runner.temp }}/lokal-iphone.json
            ${{ runner.temp }}/lokal-iphone.png
      - name: Build the native integration app once for both runtimes
        id: integration_build
        timeout-minutes: 12
        run: |
          if ! flutter build ios --simulator --debug --no-pub --target integration_test/ios_smoke_test.dart --dart-define=LOKAL_IOS_VIDEO_PROBE="$LOKAL_IOS_VIDEO_PROBE" --dart-define=LOKAL_IOS_DISCOVERY_FIXTURE="$LOKAL_IOS_DISCOVERY_FIXTURE" --verbose > "$RUNNER_TEMP/ios-smoke-build.log" 2>&1; then
            python3 tool/ios_build_diagnostics.py "$RUNNER_TEMP/ios-smoke-build.log"
            exit 1
          fi
          printf 'fixture_identity=%s\n' "$LOKAL_IOS_DISCOVERY_FIXTURE" >> "$GITHUB_OUTPUT"
          COPYFILE_DISABLE=1 tar -czf "$RUNNER_TEMP/Lokal-simulator-integration.tar.gz" -C build/ios/iphonesimulator Runner.app
      - name: Preserve the compiled integration app for the isolated runtime
        id: simulator_bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: iPhone-compiled-integration-${{ github.run_number }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/Lokal-simulator-integration.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Exercise actual startup, FFI and playback on iOS 18.6
        id: smoke
        timeout-minutes: 8
        env:
          LOKAL_IOS_RUNTIME_EVIDENCE_DIR: ${{ runner.temp }}/ios-runtime-18.6
        run: |
          if ! python3 tool/ios_smoke_runner.py > "$RUNNER_TEMP/ios-smoke.log" 2>&1; then
            python3 tool/ios_build_diagnostics.py "$RUNNER_TEMP/ios-smoke.log"
            exit 1
          fi
      - name: Qualify mixed background delivery and process recovery on iOS 18.6
        id: background
        if: ${{ !cancelled() && steps.control.outcome == 'success' && steps.smoke.outcome != 'skipped' }}
        timeout-minutes: 8
        env:
          LOKAL_IOS_RUNTIME_EVIDENCE_DIR: ${{ runner.temp }}/ios-runtime-18.6
        run: python3 tool/ios_background_transfer_probe.py
      - name: Preserve iOS 18.6 runtime evidence immediately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: iPhone-runtime-18.6-${{ github.run_number }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-runtime-18.6/
          if-no-files-found: ignore
      - name: Preserve dependency locks
        run: git diff --exit-code -- pubspec.lock rust/Cargo.lock
      - name: Collect simulator diagnostics
        if: failure() && env.IOS_SIMULATOR_UDID != ''
        timeout-minutes: 3
        run: |
          xcrun simctl spawn "$IOS_SIMULATOR_UDID" log show --last 5m --info --debug --style compact --predicate 'process == "Runner"' > "$RUNNER_TEMP/ios-simulator-console.log" || true
          mkdir -p "$RUNNER_TEMP/ios-crash-reports"
          if [ -d "$HOME/Library/Logs/DiagnosticReports" ]; then
            find "$HOME/Library/Logs/DiagnosticReports" -name 'Runner*.ips' -type f -exec cp '{}' "$RUNNER_TEMP/ios-crash-reports/" \;
          fi
      - name: Preserve generated native linker configuration
        if: failure()
        run: |
          for target in dart_smb2 rust_lib_flick_player Pods-Runner; do
            generated="ios/Pods/Target Support Files/$target"
            if [ -d "$generated" ]; then
              mkdir -p "$RUNNER_TEMP/ios-link-diagnostics/$target"
              cp "$generated"/*.xcconfig "$RUNNER_TEMP/ios-link-diagnostics/$target/"
            fi
          done
      - name: Preserve build and runtime diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: iPhone-build-diagnostics-${{ github.run_number }}-attempt${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ios-device-build.log
            ${{ runner.temp }}/ios-link-diagnostics/
            ${{ runner.temp }}/ios-simulator-build.log
            ${{ runner.temp }}/ios-smoke.log
            ${{ runner.temp }}/ios-smoke-build.log
            ${{ runner.temp }}/ios-smoke-console.log
            ${{ runner.temp }}/ios-smoke-iphone.png
            ${{ runner.temp }}/ios-main-player.png
            ${{ runner.temp }}/ios-runtime-report.json
            ${{ runner.temp }}/ios-runtime-26/
            ${{ runner.temp }}/ios-runtime-18.6/
            ${{ runner.temp }}/ios-smoke-26.log
            ${{ runner.temp }}/ios-simulator-boot-*/
            ${{ runner.temp }}/ios-simulator-console.log
            ${{ runner.temp }}/lokal-iphone.log
            ${{ runner.temp }}/lokal-iphone.json
            ${{ runner.temp }}/lokal-iphone-processes.txt
            ${{ runner.temp }}/lokal-iphone-threads-*.txt
            ${{ runner.temp }}/ios-smoke-iphone-processes.txt
            ${{ runner.temp }}/ios-smoke-iphone-threads-*.txt
            ${{ runner.temp }}/ios-crash-reports/
            ${{ runner.temp }}/lokal-iphone.png
          if-no-files-found: ignore
      - name: Summarize validation gates
        if: always()
        env:
          PACKAGE_RESULT: ${{ steps.package.outcome }}
          CONTROL_RESULT: ${{ steps.control.outcome }}
          LAUNCH_RESULT: ${{ steps.launch.outcome }}
          SMOKE_RESULT: ${{ steps.smoke.outcome }}
          BACKGROUND_RESULT: ${{ steps.background.outcome }}
        run: |
          {
            printf '## iPhone engineering build\n\n'
            printf '| Gate | Result |\n| --- | --- |\n'
            printf '| Minimal Flutter simulator control | %s |\n' "$CONTROL_RESULT"
            printf '| Device binary/package inspection | %s |\n' "$PACKAGE_RESULT"
            printf '| Native first launch | %s |\n' "$LAUNCH_RESULT"
            printf '| Real startup, scanner, QuickJS and playback on iOS 18.6 | %s |\n' "$SMOKE_RESULT"
            printf '| Mixed background delivery and process recovery | %s |\n' "$BACKGROUND_RESULT"
            printf '\nThe same compiled app is tested on iOS 26.0 in the separate fresh-runner job. Its result is required independently.\n'
            printf '\nAn engineering IPA is not a qualified release. Physical iPhone and Windows installation acceptance remain separate.\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save successfully compiled native dependencies
        if: always() && steps.device_build.outcome == 'success' && steps.simulator_build.outcome == 'success' && steps.rust_cache.outputs.cache-hit != 'true' && steps.rust_cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .dart_tool/lokal-ios-cargo
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/registry/index
          key: ${{ steps.rust_cache.outputs.cache-primary-key }}

  ios_current:
    name: Native acceptance on iOS 26.0
    needs: iphone
    # A failed iOS 18.6 assertion must not hide the other OS's evidence. A
    # cancelled/superseded workflow must not start another expensive job.
    if: ${{ !cancelled() && needs.iphone.outputs.integration_artifact != '' }}
    runs-on: macos-15
    timeout-minutes: 50
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      IPHONEOS_DEPLOYMENT_TARGET: '16.0'
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
      LOKAL_IOS_VIDEO_PROBE: ${{ inputs.live_video_probe || false }}
      LOKAL_IOS_DISCOVERY_FIXTURE: ${{ needs.iphone.outputs.integration_fixture }}
      IOS_SIMULATOR_RUNTIME_VERSION: '26.0'
      IOS_SIMULATOR_DEVICE_TYPE: com.apple.CoreSimulator.SimDeviceType.iPhone-16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Configure the isolated runtime host
        run: |
          printf 'LOKAL_IOS_RUNTIME_EVIDENCE_DIR=%s/ios-runtime-26\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          xcode-select -p
          sudo xcode-select --switch "$DEVELOPER_DIR"
          xcodebuild -version
          flutter config --no-enable-swift-package-manager
          flutter pub get --enforce-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.iphone.outputs.integration_artifact }}
          path: ${{ runner.temp }}/ios-integration-artifact
          merge-multiple: true
      - name: Restore the exact compiled app with executable modes preserved
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import tarfile
          target = Path('build/ios/iphonesimulator')
          target.mkdir(parents=True, exist_ok=True)
          archive = Path(os.environ['RUNNER_TEMP']) / 'ios-integration-artifact/Lokal-simulator-integration.tar.gz'
          with tarfile.open(archive) as bundle:
              bundle.extractall(target, filter='data')
          PY
      - name: Boot iOS 26.0 on the fresh host
        id: boot
        timeout-minutes: 16
        run: python3 tool/ios_simulator.py --recover-preinstall-boot
      - name: Verify this runtime with the minimal Flutter control app
        id: control
        timeout-minutes: 16
        run: |
          flutter create --platforms=ios --org app.lokal --project-name lokal_control "$RUNNER_TEMP/lokal-control"
          (
            cd "$RUNNER_TEMP/lokal-control"
            if ! flutter build ios --simulator --debug --verbose > "$RUNNER_TEMP/ios-control-build.log" 2>&1; then
              python3 "$GITHUB_WORKSPACE/tool/ios_build_diagnostics.py" "$RUNNER_TEMP/ios-control-build.log"
              exit 1
            fi
          )
          python3 tool/ios_control_runner.py "$RUNNER_TEMP/lokal-control/build/ios/iphonesimulator/Runner.app"
      - name: Exercise the same native integration app on iOS 26.0
        id: smoke
        timeout-minutes: 8
        run: |
          if ! python3 tool/ios_smoke_runner.py > "$RUNNER_TEMP/ios-smoke-26.log" 2>&1; then
            python3 tool/ios_build_diagnostics.py "$RUNNER_TEMP/ios-smoke-26.log"
            exit 1
          fi
      - name: Qualify mixed background delivery and process recovery on iOS 26.0
        id: background
        if: ${{ !cancelled() && steps.control.outcome == 'success' && steps.smoke.outcome != 'skipped' }}
        timeout-minutes: 8
        run: python3 tool/ios_background_transfer_probe.py
      - name: Preserve dependency locks
        run: git diff --exit-code -- pubspec.lock rust/Cargo.lock
      - name: Collect native failure diagnostics
        if: failure() && env.IOS_SIMULATOR_UDID != ''
        timeout-minutes: 3
        run: |
          xcrun simctl spawn "$IOS_SIMULATOR_UDID" log show --last 5m --info --debug --style compact --predicate 'process == "Runner"' > "$RUNNER_TEMP/ios-simulator-console.log" || true
      - name: Preserve iOS 26.0 evidence even when boot or playback fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: iPhone-runtime-26.0-${{ github.run_number }}-attempt${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ios-runtime-26/
            ${{ runner.temp }}/ios-simulator-boot-*/
            ${{ runner.temp }}/ios-smoke-26.log
            ${{ runner.temp }}/ios-control*
            ${{ runner.temp }}/ios-simulator-console.log
          if-no-files-found: ignore
      - name: Summarize the isolated runtime gates
        if: always()
        env:
          BOOT_RESULT: ${{ steps.boot.outcome }}
          CONTROL_RESULT: ${{ steps.control.outcome }}
          SMOKE_RESULT: ${{ steps.smoke.outcome }}
          BACKGROUND_RESULT: ${{ steps.background.outcome }}
        run: |
          {
            printf '## Native iOS 26.0 acceptance on a fresh host\n\n'
            printf '| Gate | Result |\n| --- | --- |\n'
            printf '| Simulator boot | %s |\n' "$BOOT_RESULT"
            printf '| Minimal Flutter control | %s |\n' "$CONTROL_RESULT"
            printf '| Real startup, scanner, QuickJS and playback | %s |\n' "$SMOKE_RESULT"
            printf '| Mixed background delivery and process recovery | %s |\n' "$BACKGROUND_RESULT"
            printf '\nUses the compiled integration app from the build job at source %s. Physical iPhone and Windows installation acceptance remain separate.\n' "$GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

  ios_release_audit:
    name: Verify IPA after both simulator suites
    needs: [iphone, ios_current]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the release audit's negative controls
        run: |
          python3 -m unittest discover -s tool -p test_ios_sideload_release.py
          python3 -m unittest discover -s tool -p test_ios_native_symbols.py
          python3 -m unittest discover -s tool -p test_ios_verify_engineering_release.py
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Lokal-iPhone-engineering-unsigned-${{ github.run_number }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/iphone-release
      - name: Independently inspect IPA, source blobs and saved symbols
        run: |
          # Do not let tee mask an audit exception: a green job must mean verified bytes.
          set -o pipefail
          python3 tool/ios_verify_engineering_release.py "$RUNNER_TEMP/iphone-release" | tee "$RUNNER_TEMP/ios-release-audit.json"
          {
            printf '## Unsigned iPhone engineering IPA audit\n\n'
            printf 'IPA bytes, manifest, all exported source blobs, native/symbol inventory and required resources verified at %s.\n\n' "$GITHUB_SHA"
            printf 'Both simulator suites are prerequisites. Local signing, physical iPhone and live provider acceptance remain separate.\n'
          } >> "$GITHUB_STEP_SUMMARY"

  publish_sideload_beta:
    name: Publish the audited unsigned iPhone beta
    needs: [iphone, ios_current, ios_release_audit]
    if: ${{ github.event_name == 'push' && startsWith(github.ref_name, 'release/ios-sideload-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Lokal-iPhone-engineering-unsigned-${{ github.run_number }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/audited-iphone
      - name: Prepare only the exact independently verified release assets
        id: release
        run: python3 tool/ios_sideload_release.py "$RUNNER_TEMP/audited-iphone" "$RUNNER_TEMP/sideload-release"
      - name: Publish the qualified pre-device beta and matching source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP"/sideload-release/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Lokal iPhone beta ${{ github.run_number }} — unsigned" \
            --notes-file "$RUNNER_TEMP/sideload-release/RELEASE-NOTES.md"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
