# Device, production launch, and integration compilation run concurrently.
# Both runtime suites and all checks remain mandatory before publication.
name: iPhone build and sideload package
'on':
  push:
    branches:
      - release/ios-sideload-*
  workflow_dispatch:
    inputs:
      publish:
        description: Update the iOS release after all build, simulator and audit checks pass
        type: boolean
        default: true
      live_video_probe:
        description: Observe the public YouTube embed in actual WebKit (network-dependent evidence)
        type: boolean
        default: false
  pull_request:
    paths:
      - ios/**
      - lib/**
      - rust/**
      - rust_builder/**
      - pubspec.*
      - tool/platform_releases.py
