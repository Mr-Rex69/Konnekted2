permissions:
  contents: read
concurrency:
  group: ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Flutter regressions (shard ${{ matrix.shard }})
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 0
          - 1
          - 2
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Verify workflow and package helpers
        if: matrix.shard == 0
        run: |
          python3 -m pip install -r tool/requirements-release-art.txt PyYAML==6.0.2
          python3 -m unittest discover -s tool -p test_ios_prepare_ffmpeg.py
          python3 -m unittest discover -s tool -p test_ios_simulator.py
          python3 -m unittest discover -s tool -p test_ios_sideload_release.py
          python3 -m unittest discover -s tool -p ci_ios_store_distribution_test.py
          python3 -m unittest discover -s tool -p test_ios_native_symbols.py
          python3 -m unittest discover -s tool -p test_ios_verify_engineering_release.py
          python3 -m unittest discover -s tool -p test_ios_control_runner.py
          python3 -m unittest discover -s tool -p test_ios_prepare_smb.py
          python3 -m unittest discover -s tool -p test_ios_package_smb.py
          python3 -m unittest discover -s tool -p test_ios_workflow.py
      - name: Analyze application and native build helper
        if: matrix.shard == 0
        run: |
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings lib integration_test
          (cd rust_builder/cargokit/build_tool && dart pub get --enforce-lockfile && dart analyze --no-fatal-warnings lib/src/builder.dart)
      - name: Verify playback ownership and transport contracts
        run: python3 tool/ios_flutter_checks.py --shards 3 --shard ${{ matrix.shard }}
      - name: Preserve dependency locks
        run: git diff --exit-code -- pubspec.lock rust/Cargo.lock
  iphone:
    name: Build iPhone IPA
    outputs:
      ipa_artifact: ${{ steps.ipa_bundle.outputs.artifact-id }}
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: macos-15
    timeout-minutes: 40
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      IPHONEOS_DEPLOYMENT_TARGET: '16.0'
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
      LOKAL_IOS_CARGO_CACHE_ROOT: ${{ github.workspace }}/.dart_tool/lokal-ios-cargo
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
      LOKAL_IOS_NATIVE_ARCHIVE_CACHE: ${{ github.workspace }}/.dart_tool/lokal-ios-native-archives
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - name: Restore checksum-pinned native archives
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .dart_tool/lokal-ios-native-archives
          key: ios-native-archives-v1-${{ hashFiles('tool/ios_prepare_ffmpeg.py', 'tool/ios_prepare_smb.py', 'pubspec.lock') }}
      - name: Configure the Apple build
        run: |
          sudo xcode-select --switch "$DEVELOPER_DIR"
          xcodebuild -version
          flutter config --no-enable-swift-package-manager
          rustup toolchain install 1.98.0 --profile minimal --no-self-update
          rustup target add --toolchain 1.98.0 aarch64-apple-ios
          flutter pub get --enforce-lockfile
          flutter precache --ios
          python3 tool/ios_readiness.py --require-scaffold --require-localizations
      - name: Generate native alternate icons
        run: |
          python3 -m venv "$RUNNER_TEMP/lokal-ios-assets"
          "$RUNNER_TEMP/lokal-ios-assets/bin/pip" install -r tool/requirements-release-art.txt
          "$RUNNER_TEMP/lokal-ios-assets/bin/python" tool/gen_ios_icons.py
      - name: Verify the FFmpeg native dependency
        run: python3 tool/ios_prepare_ffmpeg.py
      - name: Verify and stage native SMB
        run: |
          python3 tool/ios_prepare_smb.py
          python3 tool/ios_smb_link_probe.py
      - name: Verify native transfer storage and the real Flutter bridge
        run: |
          python3 tool/ios_transfer_contracts.py --check-ios-sdks --check-flutter-bridge --repeat-native 5
      - name: Restore native dependencies with Cargo fingerprint validation
        id: rust_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .dart_tool/lokal-ios-cargo/iphoneos/Release
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/registry/index
          key: ios-cargo-symbols-v3-${{ runner.os }}-${{ runner.arch }}-xcode26.0.1-rust1.98.0-iphoneos-Release-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml', 'rust/cargokit.yaml', 'rust/vendor/**', 'rust_builder/cargokit/build_tool/lib/**', 'rust_builder/cargokit/build_tool/pubspec.lock', 'rust_builder/cargokit/*.sh') }}-${{ hashFiles('rust/**/*.rs') }}
          restore-keys: |
            ios-cargo-symbols-v3-${{ runner.os }}-${{ runner.arch }}-xcode26.0.1-rust1.98.0-iphoneos-Release-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml', 'rust/cargokit.yaml', 'rust/vendor/**', 'rust_builder/cargokit/build_tool/lib/**', 'rust_builder/cargokit/build_tool/pubspec.lock', 'rust_builder/cargokit/*.sh') }}-
      - name: Build the release iPhone app without signing credentials
        id: device_build
        run: |
          if ! flutter build ios --release --no-codesign --no-pub --build-number '${{ github.run_number }}' --split-debug-info=build/ios/dart-symbols --verbose > "$RUNNER_TEMP/ios-device-build.log" 2>&1; then
            python3 tool/ios_build_diagnostics.py "$RUNNER_TEMP/ios-device-build.log"
            exit 1
          fi
      - name: Inspect and package the engineering IPA
        id: package
        run: |
          python3 tool/ios_package.py build/ios/iphoneos/Runner.app build/ios/ipa/Lokal-unsigned.ipa --dart-symbols build/ios/dart-symbols
          git archive --format=tar.gz HEAD -o build/ios/ipa/Lokal-source.tar.gz
      - name: Upload the iPhone IPA immediately
        id: ipa_bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          compression-level: 0
          name: Lokal-iPhone-engineering-unsigned-${{ github.run_number }}-attempt${{ github.run_attempt }}
          path: |
            build/ios/ipa/*
            build/ios/iphoneos/*.dSYM
          if-no-files-found: error
          retention-days: 30
      - name: Preserve dependency locks
        run: git diff --exit-code -- pubspec.lock rust/Cargo.lock
      - name: Preserve device build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          compression-level: 0
          name: iPhone-device-build-${{ github.run_number }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-device-build.log
          if-no-files-found: ignore
      - name: Save successfully compiled native dependencies
        if: 'always() && !cancelled() && steps.device_build.outcome == ''success'' && steps.rust_cache.outputs.cache-hit != ''true'''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .dart_tool/lokal-ios-cargo/iphoneos/Release
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/registry/index
          key: ${{ steps.rust_cache.outputs.cache-primary-key }}
  production_launch:
    name: Production entry point and first launch
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      IPHONEOS_DEPLOYMENT_TARGET: '16.0'
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
      LOKAL_IOS_CARGO_CACHE_ROOT: ${{ github.workspace }}/.dart_tool/lokal-ios-cargo
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
      LOKAL_IOS_NATIVE_ARCHIVE_CACHE: ${{ github.workspace }}/.dart_tool/lokal-ios-native-archives
      IOS_SIMULATOR_RUNTIME_VERSION: '18.6'
      IOS_SIMULATOR_DEVICE_TYPE: com.apple.CoreSimulator.SimDeviceType.iPhone-16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - name: Restore checksum-pinned native archives
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .dart_tool/lokal-ios-native-archives
          key: ios-native-archives-v1-${{ hashFiles('tool/ios_prepare_ffmpeg.py', 'tool/ios_prepare_smb.py', 'pubspec.lock') }}
      - name: Configure the Apple build
        run: |
          sudo xcode-select --switch "$DEVELOPER_DIR"
          xcodebuild -version
          flutter config --no-enable-swift-package-manager
          rustup toolchain install 1.98.0 --profile minimal --no-self-update
          rustup target add --toolchain 1.98.0 aarch64-apple-ios-sim
          flutter pub get --enforce-lockfile
          flutter precache --ios
          python3 tool/ios_readiness.py --require-scaffold --require-localizations
      - name: Generate native alternate icons
        run: |
          python3 -m venv "$RUNNER_TEMP/lokal-ios-assets"
          "$RUNNER_TEMP/lokal-ios-assets/bin/pip" install -r tool/requirements-release-art.txt
          "$RUNNER_TEMP/lokal-ios-assets/bin/python" tool/gen_ios_icons.py
      - name: Verify the FFmpeg native dependency
        run: python3 tool/ios_prepare_ffmpeg.py
      - name: Verify and stage native SMB
        run: |
          python3 tool/ios_prepare_smb.py
          python3 tool/ios_smb_link_probe.py
      - name: Restore native dependencies with Cargo fingerprint validation
        id: rust_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .dart_tool/lokal-ios-cargo/iphonesimulator/Debug
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/registry/index
          key: ios-cargo-symbols-v3-${{ runner.os }}-${{ runner.arch }}-xcode26.0.1-rust1.98.0-iphonesimulator-Debug-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml', 'rust/cargokit.yaml', 'rust/vendor/**', 'rust_builder/cargokit/build_tool/lib/**', 'rust_builder/cargokit/build_tool/pubspec.lock', 'rust_builder/cargokit/*.sh') }}-${{ hashFiles('rust/**/*.rs') }}
          restore-keys: |
            ios-cargo-symbols-v3-${{ runner.os }}-${{ runner.arch }}-xcode26.0.1-rust1.98.0-iphonesimulator-Debug-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml', 'rust/cargokit.yaml', 'rust/vendor/**', 'rust_builder/cargokit/build_tool/lib/**', 'rust_builder/cargokit/build_tool/pubspec.lock', 'rust_builder/cargokit/*.sh') }}-
      - name: Build the complete app for iOS simulator
        id: simulator_build
        run: |
          if ! flutter build ios --simulator --debug --no-pub --verbose > "$RUNNER_TEMP/ios-simulator-build.log" 2>&1; then
            python3 tool/ios_build_diagnostics.py "$RUNNER_TEMP/ios-simulator-build.log"
            exit 1
          fi
      - name: Boot an iPhone simulator
        timeout-minutes: 16
        run: python3 tool/ios_simulator.py --recover-preinstall-boot
      - name: Verify the simulator with a minimal Flutter control app
        id: control
        timeout-minutes: 16
        run: |
          flutter create --platforms=ios --org app.lokal --project-name lokal_control "$RUNNER_TEMP/lokal-control"
          (
            cd "$RUNNER_TEMP/lokal-control"
            if ! flutter build ios --simulator --debug --verbose > "$RUNNER_TEMP/ios-control-build.log" 2>&1; then
              python3 "$GITHUB_WORKSPACE/tool/ios_build_diagnostics.py" "$RUNNER_TEMP/ios-control-build.log"
              exit 1
            fi
          )
          python3 tool/ios_control_runner.py "$RUNNER_TEMP/lokal-control/build/ios/iphonesimulator/Runner.app"
      - name: Capture the actual first launch
        id: launch
        run: python3 tool/ios_launch_probe.py
      - name: Preserve dependency locks
        run: git diff --exit-code -- pubspec.lock rust/Cargo.lock
      - name: Preserve production first-launch evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          compression-level: 0
          name: iPhone-production-launch-${{ github.run_number }}-attempt${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/lokal-iphone*
            ${{ runner.temp }}/ios-simulator-build.log
            ${{ runner.temp }}/ios-control*
            ${{ runner.temp }}/ios-simulator-boot-*/
            ${{ runner.temp }}/ios-crash-reports/
          if-no-files-found: ignore
      - name: Save successfully compiled native dependencies
        if: 'always() && !cancelled() && steps.simulator_build.outcome == ''success'' && steps.rust_cache.outputs.cache-hit != ''true'''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .dart_tool/lokal-ios-cargo/iphonesimulator/Debug
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/registry/index
          key: ${{ steps.rust_cache.outputs.cache-primary-key }}
  simulator_build:
    name: Compile integration simulator apps
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: macos-15
    timeout-minutes: 45
    outputs:
      integration_artifact: ${{ steps.simulator_bundle.outputs.artifact-id }}
      integration_fixture: ${{ steps.integration_build.outputs.fixture_identity }}
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      IPHONEOS_DEPLOYMENT_TARGET: '16.0'
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
      LOKAL_IOS_CARGO_CACHE_ROOT: ${{ github.workspace }}/.dart_tool/lokal-ios-cargo
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
      LOKAL_IOS_NATIVE_ARCHIVE_CACHE: ${{ github.workspace }}/.dart_tool/lokal-ios-native-archives
      LOKAL_IOS_VIDEO_PROBE: ${{ inputs.live_video_probe || false }}
      LOKAL_IOS_DISCOVERY_FIXTURE: lokal-ios-fixture-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - name: Restore checksum-pinned native archives
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .dart_tool/lokal-ios-native-archives
          key: ios-native-archives-v1-${{ hashFiles('tool/ios_prepare_ffmpeg.py', 'tool/ios_prepare_smb.py', 'pubspec.lock') }}
      - name: Configure the Apple build
        run: |
          sudo xcode-select --switch "$DEVELOPER_DIR"
          xcodebuild -version
          flutter config --no-enable-swift-package-manager
          rustup toolchain install 1.98.0 --profile minimal --no-self-update
          rustup target add --toolchain 1.98.0 aarch64-apple-ios-sim
          flutter pub get --enforce-lockfile
          flutter precache --ios
          python3 tool/ios_readiness.py --require-scaffold --require-localizations
      - name: Generate native alternate icons
        run: |
          python3 -m venv "$RUNNER_TEMP/lokal-ios-assets"
          "$RUNNER_TEMP/lokal-ios-assets/bin/pip" install -r tool/requirements-release-art.txt
          "$RUNNER_TEMP/lokal-ios-assets/bin/python" tool/gen_ios_icons.py
      - name: Verify the FFmpeg native dependency
        run: python3 tool/ios_prepare_ffmpeg.py
      - name: Verify and stage native SMB
        run: |
          python3 tool/ios_prepare_smb.py
          python3 tool/ios_smb_link_probe.py
      - name: Restore native dependencies with Cargo fingerprint validation
        id: rust_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .dart_tool/lokal-ios-cargo/iphonesimulator/Debug
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/registry/index
          key: ios-cargo-symbols-v3-${{ runner.os }}-${{ runner.arch }}-xcode26.0.1-rust1.98.0-iphonesimulator-Debug-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml', 'rust/cargokit.yaml', 'rust/vendor/**', 'rust_builder/cargokit/build_tool/lib/**', 'rust_builder/cargokit/build_tool/pubspec.lock', 'rust_builder/cargokit/*.sh') }}-${{ hashFiles('rust/**/*.rs') }}
          restore-keys: |
            ios-cargo-symbols-v3-${{ runner.os }}-${{ runner.arch }}-xcode26.0.1-rust1.98.0-iphonesimulator-Debug-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml', 'rust/cargokit.yaml', 'rust/vendor/**', 'rust_builder/cargokit/build_tool/lib/**', 'rust_builder/cargokit/build_tool/pubspec.lock', 'rust_builder/cargokit/*.sh') }}-
      - name: Build the integration app for both runtimes
        id: integration_build
        timeout-minutes: 30
        run: |
          if ! flutter build ios --simulator --debug --no-pub --target integration_test/ios_smoke_test.dart --dart-define=LOKAL_IOS_VIDEO_PROBE="$LOKAL_IOS_VIDEO_PROBE" --dart-define=LOKAL_IOS_DISCOVERY_FIXTURE="$LOKAL_IOS_DISCOVERY_FIXTURE" --verbose > "$RUNNER_TEMP/ios-smoke-build.log" 2>&1; then
            python3 tool/ios_build_diagnostics.py "$RUNNER_TEMP/ios-smoke-build.log"
            exit 1
          fi
          printf 'fixture_identity=%s\n' "$LOKAL_IOS_DISCOVERY_FIXTURE" >> "$GITHUB_OUTPUT"
      - name: Compile the minimal Flutter control once for both runtimes
        timeout-minutes: 16
        run: |
          flutter create --platforms=ios --org app.lokal --project-name lokal_control "$RUNNER_TEMP/lokal-control"
          (
            cd "$RUNNER_TEMP/lokal-control"
            if ! flutter build ios --simulator --debug --verbose > "$RUNNER_TEMP/ios-control-build.log" 2>&1; then
              python3 "$GITHUB_WORKSPACE/tool/ios_build_diagnostics.py" "$RUNNER_TEMP/ios-control-build.log"
              exit 1
            fi
          )
      - name: Package both compiled simulator apps with executable modes
        run: |
          python3 - <<'BUNDLE'
          import os
          from pathlib import Path
          import tarfile
          root = Path(os.environ['RUNNER_TEMP'])
          with tarfile.open(root / 'Lokal-simulator-integration.tar.gz', 'w:gz', compresslevel=1) as archive:
              archive.add('build/ios/iphonesimulator/Runner.app', arcname='integration/Runner.app')
              archive.add(root / 'lokal-control/build/ios/iphonesimulator/Runner.app', arcname='control/Runner.app')
          BUNDLE
      - name: Preserve the compiled integration app for the isolated runtime
        id: simulator_bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          compression-level: 0
          name: iPhone-compiled-integration-${{ github.run_number }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/Lokal-simulator-integration.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Preserve dependency locks
        run: git diff --exit-code -- pubspec.lock rust/Cargo.lock
      - name: Preserve simulator build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          compression-level: 0
          name: iPhone-simulator-build-${{ github.run_number }}-attempt${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ios-smoke-build.log
            ${{ runner.temp }}/ios-control-build.log
          if-no-files-found: ignore
      - name: Save successfully compiled native dependencies
        if: 'always() && !cancelled() && steps.integration_build.outcome == ''success'' && steps.rust_cache.outputs.cache-hit != ''true'''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .dart_tool/lokal-ios-cargo/iphonesimulator/Debug
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/registry/index
          key: ${{ steps.rust_cache.outputs.cache-primary-key }}
  ios_acceptance:
    name: Native acceptance on iOS ${{ matrix.ios }}
    needs: simulator_build
    runs-on: macos-15
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        ios:
          - '18.6'
          - '26.0'
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
      LOKAL_IOS_VIDEO_PROBE: ${{ inputs.live_video_probe || false }}
      LOKAL_IOS_DISCOVERY_FIXTURE: ${{ needs.simulator_build.outputs.integration_fixture }}
      IOS_SIMULATOR_RUNTIME_VERSION: ${{ matrix.ios }}
      IOS_SIMULATOR_DEVICE_TYPE: com.apple.CoreSimulator.SimDeviceType.iPhone-16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - name: Configure runtime host without rebuilding either app
        run: |
          printf 'LOKAL_IOS_RUNTIME_EVIDENCE_DIR=%s/ios-runtime-%s\n' "$RUNNER_TEMP" '${{ matrix.ios }}' >> "$GITHUB_ENV"
          sudo xcode-select --switch "$DEVELOPER_DIR"
          flutter config --no-enable-swift-package-manager
          flutter pub get --enforce-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.simulator_build.outputs.integration_artifact }}
          path: ${{ runner.temp }}/ios-integration-artifact
          merge-multiple: true
      - name: Restore exact compiled apps with executable modes
        run: |
          python3 - <<'RESTORE'
          import os
          from pathlib import Path
          import shutil
          import tarfile
          root = Path(os.environ['RUNNER_TEMP'])
          with tarfile.open(root / 'ios-integration-artifact/Lokal-simulator-integration.tar.gz') as archive:
              archive.extractall(root / 'compiled-apps', filter='data')
          target = Path('build/ios/iphonesimulator/Runner.app')
          target.parent.mkdir(parents=True, exist_ok=True)
          shutil.copytree(root / 'compiled-apps/integration/Runner.app', target, symlinks=True)
          RESTORE
      - name: Boot the selected iPhone runtime
        id: boot
        timeout-minutes: 16
        run: python3 tool/ios_simulator.py --recover-preinstall-boot
      - name: Verify runtime with the precompiled Flutter control
        id: control
        timeout-minutes: 16
        run: python3 tool/ios_control_runner.py "$RUNNER_TEMP/compiled-apps/control/Runner.app"
      - name: Exercise actual startup, FFI and playback
        id: smoke
        timeout-minutes: 8
        run: |
          if ! python3 tool/ios_smoke_runner.py > "$RUNNER_TEMP/ios-smoke.log" 2>&1; then
            python3 tool/ios_build_diagnostics.py "$RUNNER_TEMP/ios-smoke.log"
            exit 1
          fi
      - name: Qualify background delivery and process recovery
        id: background
        if: '!cancelled() && steps.control.outcome == ''success'' && steps.smoke.outcome != ''skipped'''
        timeout-minutes: 8
        run: python3 tool/ios_background_transfer_probe.py
      - name: Preserve dependency locks
        run: git diff --exit-code -- pubspec.lock rust/Cargo.lock
      - name: Preserve runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          compression-level: 0
          name: iPhone-runtime-${{ matrix.ios }}-${{ github.run_number }}-attempt${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ios-runtime-${{ matrix.ios }}/
            ${{ runner.temp }}/ios-smoke.log
            ${{ runner.temp }}/ios-control*
            ${{ runner.temp }}/ios-simulator-boot-*/
          if-no-files-found: ignore
  ios_release_audit:
    name: Verify IPA and matching source
    needs: iphone
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify the release audit's negative controls
        run: |
          python3 -m unittest discover -s tool -p test_ios_sideload_release.py
          python3 -m unittest discover -s tool -p test_ios_native_symbols.py
          python3 -m unittest discover -s tool -p test_ios_verify_engineering_release.py
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.iphone.outputs.ipa_artifact }}
          merge-multiple: true
          path: ${{ runner.temp }}/iphone-release
      - name: Independently inspect IPA, source blobs and saved symbols
        run: |
          # Do not let tee mask an audit exception: a green job must mean verified bytes.
          set -o pipefail
          python3 tool/ios_verify_engineering_release.py "$RUNNER_TEMP/iphone-release" | tee "$RUNNER_TEMP/ios-release-audit.json"
          {
            printf '## Unsigned iPhone engineering IPA audit\n\n'
            printf 'IPA bytes, manifest, all exported source blobs, native/symbol inventory and required resources verified at %s.\n\n' "$GITHUB_SHA"
            printf 'Publication separately requires both simulator suites. Local signing, physical iPhone and live provider acceptance remain separate.\n'
          } >> "$GITHUB_STEP_SUMMARY"
  publish_sideload_beta:
    name: Publish Lokal for iPhone
    needs:
      - checks
      - iphone
      - production_launch
      - ios_acceptance
      - ios_release_audit
    if: ${{ (github.event_name == 'push' && startsWith(github.ref_name, 'release/ios-sideload-')) || (github.event_name == 'workflow_dispatch' && github.ref_name == 'main' && inputs.publish) }}
    concurrency:
      group: lokal-mobile-publication
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.iphone.outputs.ipa_artifact }}
          merge-multiple: true
          path: ${{ runner.temp }}/audited-iphone
      - name: Prepare only the exact independently verified release assets
        id: release
        env:
          LOKAL_IOS_PUBLISH: ${{ inputs.publish }}
        run: python3 tool/ios_sideload_release.py "$RUNNER_TEMP/audited-iphone" "$RUNNER_TEMP/sideload-release"
      - name: Publish the iOS release and AltStore/SideStore source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tool/platform_releases.py publish --platform ios \
            --assets "$RUNNER_TEMP/sideload-release" --sha "$GITHUB_SHA" \
            --notes "$RUNNER_TEMP/sideload-release/RELEASE-NOTES.md"
          gh release view ios --repo "$GITHUB_REPOSITORY" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
