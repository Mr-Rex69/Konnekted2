name: Release Lokal Mobile
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Optional exact version (overrides bump)
        type: string
        default: ''
      flavor:
        description: APK variant (Android 8.0+ on 64-bit ARM phones)
        type: choice
        options: [full, play, both]
        default: full
      replace_existing:
        description: Keep the current Android version and publish a newer build
        type: boolean
        default: false
      build_number:
        description: Optional versionCode override (normally leave blank)
        type: string
        default: ''
      draft:
        description: Build artifacts only; leave the public Android release unchanged
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: lokal-mobile-publication
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'lokal-music/Mobile'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      build_number: ${{ steps.metadata.outputs.build_number }}
      flavors: ${{ steps.metadata.outputs.flavors }}
      sha: ${{ steps.metadata.outputs.sha }}
      previous_sha: ${{ steps.published.outputs.published_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require main
        run: |
          test "$GITHUB_REF" = refs/heads/main
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - name: Read the published Android version and build
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tool/platform_releases.py metadata --platform android
      - name: Calculate version and pin this commit
        id: metadata
        env:
          RELEASE_REPLACE: ${{ inputs.replace_existing }}
          RELEASE_BUMP: ${{ inputs.bump }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: stable
          RELEASE_FLAVOR: ${{ inputs.flavor }}
          RELEASE_BUILD_NUMBER: ${{ inputs.build_number }}
          RELEASE_PUBLISHED_VERSION: ${{ steps.published.outputs.published_version }}
          RELEASE_PUBLISHED_BUILD: ${{ steps.published.outputs.published_build }}
        run: python3 tool/release_channels.py
      - name: Render mobile release banner
        env:
          BANNER_VERSION: ${{ steps.metadata.outputs.version }}
          BANNER_TYPE: stable
        run: |
          python3 -m pip install --disable-pip-version-check -r tool/requirements-release-art.txt
          python3 tool/render_release_banner.py --output release-banner.png
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-banner-${{ steps.metadata.outputs.build_number }}
          path: release-banner.png
          if-no-files-found: error
  build:
    needs: prepare
    uses: ./.github/workflows/android-signed-build.yml
    with:
      sha: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}
      build_number: ${{ needs.prepare.outputs.build_number }}
      flavors: ${{ needs.prepare.outputs.flavors }}
    secrets: inherit
  publish:
    needs: [prepare, build]
    if: ${{ !inputs.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: android-*-${{ needs.prepare.outputs.build_number }}
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mobile-banner-${{ needs.prepare.outputs.build_number }}
          path: release
      - name: Verify APKs and prepare platform release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CODE: ${{ needs.prepare.outputs.build_number }}
          PREVIOUS_SHA: ${{ needs.prepare.outputs.previous_sha }}
        run: |
          set -euo pipefail
          (cd release && cat SHA256SUMS-*.txt > SHA256SUMS && sha256sum --check --strict SHA256SUMS)
          cat > "$RUNNER_TEMP/mobile-release-notes.md" <<EOF_NOTES
          ![Lokal Mobile](https://github.com/$GITHUB_REPOSITORY/releases/download/android/release-banner.png)

          **Lokal Mobile $VERSION** · Android 8.0+ · 64-bit ARM phones · versionCode $CODE

          Download the full APK below for sideloading. Signed releases update existing installs without uninstalling.
          This Android download page and tag stay the same; successful releases replace the attached build.

          ## What's Changed
          EOF_NOTES
          if [ -n "$PREVIOUS_SHA" ] && [ "$PREVIOUS_SHA" != "$GITHUB_SHA" ]; then
            git log --format='* %s' -50 "$PREVIOUS_SHA..$GITHUB_SHA" >> "$RUNNER_TEMP/mobile-release-notes.md"
            printf '\n[Full changelog](https://github.com/%s/compare/%s...%s)\n' "$GITHUB_REPOSITORY" "$PREVIOUS_SHA" "$GITHUB_SHA" >> "$RUNNER_TEMP/mobile-release-notes.md"
          else
            printf '* Updated signed Android build.\n' >> "$RUNNER_TEMP/mobile-release-notes.md"
          fi
      - name: Update the Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tool/platform_releases.py publish --platform android --assets release \
            --sha "$GITHUB_SHA" --notes "$RUNNER_TEMP/mobile-release-notes.md"
          gh release view android --repo "$GITHUB_REPOSITORY" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
