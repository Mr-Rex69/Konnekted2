name: iOS simulator boot coordinator tests
'on':
  pull_request:
    paths:
      - 'tool/ios_simulator.py'
      - 'tool/test_ios_simulator.py'
      - '.github/workflows/ios-simulator-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'tool/ios_simulator.py'
      - 'tool/test_ios_simulator.py'
      - '.github/workflows/ios-simulator-contracts.yml'
permissions:
  contents: read
jobs:
  contracts:
    name: Simulator boot and recovery contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run isolated simulator coordinator tests
        run: python3 -m unittest discover -s tool -p test_ios_simulator.py
