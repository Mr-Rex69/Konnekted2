name: Build Lokal Mobile Nightly (artifacts only)
on:
  workflow_dispatch:
    inputs:
      flavor:
        description: APK variant (Android 8.0+ on 64-bit ARM phones)
        type: choice
        options: [full, play, both]
        default: full
      build_number:
        description: Optional versionCode override (normally leave blank)
        type: string
        default: ''

permissions:
  contents: read
# Shared signing identity and versionCode clock: serialize both channels.
concurrency:
  group: lokal-mobile-publication
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'lokal-music/Mobile'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      build_number: ${{ steps.metadata.outputs.build_number }}
      flavors: ${{ steps.metadata.outputs.flavors }}
      sha: ${{ steps.metadata.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require trusted main history
        run: git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - name: Read the published Android baseline
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tool/platform_releases.py metadata --platform android
      - name: Work out version and pin this commit
        id: metadata
        env:
          RELEASE_CHANNEL: nightly
          RELEASE_PUBLISHED_VERSION: ${{ steps.published.outputs.published_version }}
          RELEASE_PUBLISHED_BUILD: ${{ steps.published.outputs.published_build }}
          RELEASE_FLAVOR: ${{ inputs.flavor || 'full' }}
          RELEASE_BUILD_NUMBER: ${{ inputs.build_number }}
        run: python3 tool/release_channels.py
      - name: Explain artifact-only previews
        run: echo 'Nightly APKs are saved as workflow artifacts. The public Android release changes only through Release Lokal Mobile.' >> "$GITHUB_STEP_SUMMARY"
  build:
    needs: prepare
    uses: ./.github/workflows/android-signed-build.yml
    with:
      sha: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}
      build_number: ${{ needs.prepare.outputs.build_number }}
      flavors: ${{ needs.prepare.outputs.flavors }}
    secrets: inherit
