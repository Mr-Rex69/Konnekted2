name: Mobile Flow and AutoMix regressions

on:
  pull_request:
    paths:
      - 'lib/features/flow/**'
      - 'lib/services/android_audio_engine.dart'
      - 'lib/services/automix_*.dart'
      - 'lib/services/player_service.dart'
      - 'lib/services/audio_session_manager.dart'
      - 'lib/services/uac2_preferences_service.dart'
      - 'lib/services/uac2_service.dart'
      - 'rust/src/audio/android_mixer.rs'
      - 'rust/src/audio/engine.rs'
      - 'rust/src/audio/manager.rs'
      - 'android/app/src/main/kotlin/com/mossapps/flick/AndroidUsbMixer.kt'
      - 'test/services/android_usb_mixer_preferences_test.dart'
      - 'test/flow/**'
      - 'test/services/automix_*.dart'
      - 'test/services/android_audio_*.dart'
      - '.github/workflows/flow-automix-ci.yml'
  push:
    paths:
      - 'lib/features/flow/**'
      - 'lib/services/android_audio_engine.dart'
      - 'lib/services/automix_*.dart'
      - 'lib/services/player_service.dart'
      - 'lib/services/audio_session_manager.dart'
      - 'lib/services/uac2_preferences_service.dart'
      - 'lib/services/uac2_service.dart'
      - 'rust/src/audio/android_mixer.rs'
      - 'rust/src/audio/engine.rs'
      - 'rust/src/audio/manager.rs'
      - 'android/app/src/main/kotlin/com/mossapps/flick/AndroidUsbMixer.kt'
      - 'test/services/android_usb_mixer_preferences_test.dart'
      - 'test/flow/**'
      - 'test/services/automix_*.dart'
      - 'test/services/android_audio_*.dart'
      - '.github/workflows/flow-automix-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-flutter:
    name: Flow and Android AutoMix tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/android-toolchain
      - name: Compile and test model cue cache, Android handoffs and Flow
        run: >-
          flutter test --no-pub
          test/flow
          test/services/automix_analysis_cache_test.dart
          test/services/automix_advanced_report_test.dart
          test/services/automix_stem_clip_test.dart
          test/services/android_audio_engine_crossfade_test.dart
          test/services/android_audio_failed_source_test.dart
          test/services/android_usb_mixer_preferences_test.dart
          test/services/motion_art_suppression_test.dart
          test/services/output_precision_preferences_test.dart
      - name: Compile Flutter Android APK
        run: flutter build apk --debug --flavor full --target-platform android-arm64 --no-pub
