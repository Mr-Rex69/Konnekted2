name: Stations high-quality browser

on:
  pull_request:
    paths:
      - 'lib/features/internet_radio/**'
      - 'lib/features/konnekted/konnekted_dock.dart'
      - 'lib/features/konnekted/konnekted_shell.dart'
      - 'lib/features/konnekted/konnekted_home.dart'
      - 'lib/features/konnekted/konnekted_library.dart'
      - 'lib/features/konnekted/library/lokal_library_pages.dart'
      - 'lib/features/konnekted/library/lokal_song_browser.dart'
      - 'test/konnekted/library_recently_played_shelf_test.dart'
      - 'lib/features/player/screens/full_player_screen.dart'
      - 'lib/features/player/widgets/player_panel_stage.dart'
      - 'lib/features/player/widgets/space_cover_bloom_reveal.dart'
      - 'lib/services/android_audio_device_service.dart'
      - 'android/app/src/main/kotlin/com/mossapps/flick/MainActivity.kt'
      - 'test/player/space_cover_bloom_reveal_test.dart'
      - 'lib/features/search/screens/search_screen.dart'
      - 'test/features/internet_radio/**'
      - 'lib/features/settings/lokal/**'
      - '.github/workflows/stations-ci.yml'
  push:
    branches:
      - feat/stations-radio-browser-hq-256
      - fix/stations-now-playing-integration-20261103

permissions:
  contents: read

jobs:
  stations-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/android-toolchain
      - name: Analyze Stations and radio playback
        run: |
          set -euo pipefail
          for source in \
            lib/features/internet_radio/radio_browser.dart \
            lib/features/internet_radio/station_metadata.dart \
            lib/features/internet_radio/station_favorites.dart \
            lib/features/internet_radio/internet_radio_page.dart \
            lib/features/internet_radio/radio_browse_selection.dart \
            lib/features/internet_radio/radio_providers.dart \
            lib/features/internet_radio/radio_now_playing_page.dart \
            lib/features/player/widgets/player_panel_stage.dart \
            lib/features/player/widgets/space_cover_bloom_reveal.dart \
            lib/features/konnekted/konnekted_dock.dart \
            lib/features/konnekted/konnekted_shell.dart \
            lib/features/konnekted/konnekted_home.dart \
            lib/features/konnekted/konnekted_library.dart \
            lib/features/konnekted/library/lokal_library_pages.dart \
            lib/features/konnekted/library/lokal_song_browser.dart \
            lib/features/player/screens/full_player_screen.dart \
            lib/features/search/screens/search_screen.dart; do
            dart analyze --no-fatal-warnings "$source"
          done
      - name: Run station quality, metadata and existing radio regression tests
        run: >-
          flutter test --no-pub
          test/features/internet_radio/radio_browser_test.dart
          test/features/internet_radio/radio_timeout_test.dart
          test/features/internet_radio/radio_now_playing_page_test.dart
          test/player/space_cover_bloom_reveal_test.dart
          test/konnekted/library_recently_played_shelf_test.dart
          test/widgets/lokal/lokal_player_route_test.dart
      - name: Compile Android route integration
        run: flutter build apk --debug --flavor full --target-platform android-arm64 --no-pub
