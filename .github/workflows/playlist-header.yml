name: Mobile playlists and offline downloads
on:
  pull_request:
    paths:
      - 'lib/features/konnekted/library/collection_download*.dart'
      - 'lib/features/konnekted/konnekted_data.dart'
      - 'lib/features/konnekted/library/lokal_library_pages.dart'
      - 'lib/services/favorites_service.dart'
      - 'lib/features/playlist_links/playlist_unmatched_downloader.dart'
      - 'test/konnekted/collection_download*test.dart'
      - 'lib/features/konnekted/library/lokal_library_kit.dart'
      - 'lib/features/konnekted/library/lokal_playlists.dart'
      - 'lib/features/konnekted/library/lokal_song_browser.dart'
      - 'lib/features/konnekted/library/playlist_hero_header.dart'
      - 'lib/features/spotify/provider_playlist_track_browser.dart'
      - 'lib/features/spotify/spotify_playlists_screen.dart'
      - 'lib/features/discovery/youtube_music_playlists_screen.dart'
      - 'test/konnekted/playlist_*test.dart'
      - 'test/widgets/provider_playlist_track_browser_test.dart'
      - '.github/workflows/playlist-header.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  playlist-header:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Analyze shared playlist presentation
        run: >-
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
          lib/features/konnekted/library/collection_downloads.dart
          lib/features/konnekted/library/collection_download_dialog.dart
          lib/features/konnekted/library/lokal_library_kit.dart
          lib/features/konnekted/library/playlist_hero_header.dart
          lib/features/spotify/provider_playlist_track_browser.dart
          lib/features/spotify/spotify_playlists_screen.dart
          lib/features/discovery/youtube_music_playlists_screen.dart
      - name: Verify safe areas, keyboard, text scaling, pixel seams and playlist controls
        run: >-
          flutter test --no-pub
          test/konnekted/collection_downloads_test.dart
          test/konnekted/collection_download_actions_test.dart
          test/playlist_links/playlist_unmatched_downloader_test.dart
          test/services/online_favorites_test.dart
          test/konnekted/playlist_header_layout_test.dart
          test/konnekted/playlist_hero_header_test.dart
          test/widgets/provider_playlist_track_browser_test.dart
          test/konnekted/library_occurrence_selection_test.dart
          test/konnekted/liked_sort_persistence_test.dart
      - run: git diff --exit-code -- pubspec.lock
