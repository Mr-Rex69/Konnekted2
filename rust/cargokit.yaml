# Android keeps Cargo.toml defaults, including uac2. The iOS builder uses
# --no-default-features --features native_audio; shared flags must not add USB.
cargo:
  debug:
    toolchain: 1.98.0
    extra_flags:
      - --locked
  release:
    toolchain: 1.98.0
    extra_flags:
      - --locked
  profile:
    toolchain: 1.98.0
    extra_flags:
      - --locked
